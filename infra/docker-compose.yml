version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: organizador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: organizador
      POSTGRES_USER: organizador
      POSTGRES_PASSWORD: organizador
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
