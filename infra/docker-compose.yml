version: '3.8'
services:
  db:
    image: postgres:16
    container_name: organizador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: organizador
      POSTGRES_USER: organizador
      POSTGRES_PASSWORD: organizador
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizador -d organizador"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: organizador-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://organizador:organizador@db:5432/organizador?schema=public
    ports:
      - '3000:3000'

volumes:
  pg_data:
